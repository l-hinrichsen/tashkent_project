<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tashkent</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
    .title-card {
      position: absolute; top: 14px; left: 14px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3); max-width: 320px;
    }
    .title-card h1 { margin: 0 0 4px; font-size: 1.1rem; }
    .title-card p  { margin: 0; font-size: 0.85rem; color: #444; }
    .popup-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
    .popup-date { color: #666; font-size: 0.82rem; margin-bottom: 6px; }
    .popup-desc { font-size: 0.9rem; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="title-card">
    <h1>Tashkent</h1>
    <p>Click any point to read about it. Click it again to zoom in.</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const MAIN_PLACE = "Tashkent";
  const START_ZOOM = 4;
  const CLICK_ZOOM = 12;

  const data = {"type":"FeatureCollection","features":[{"type":"Feature","geometry":
  {"type":"Point","coordinates":[69.278708,41.312336]},"bbox":[69.122647,41.164237,69.47862,41.422548],"properties":{"name":"Tashkent"}},
  {"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[69.278735,41.166229],[69.394737,41.243857],[69.383136,41.255333],[69.397179,41.264971],[69.384357,41.26543],[69.383136,41.26956],[69.476548,41.345232],[69.474106,41.34844],[69.411831,41.342023],[69.411221,41.349357],[69.404505,41.362647],[69.393515,41.367687],[69.36482,41.363105],[69.348947,41.354398],[69.325746,41.36952],[69.317199,41.382806],[69.286062,41.384638],[69.26164,41.395631],[69.235387,41.398379],[69.166397,41.353023],[69.162734,41.330104],[69.153576,41.327354],[69.14686,41.312222],[69.147471,41.305802],[69.137702,41.295711],[69.138923,41.292959],[69.132207,41.288371],[69.134039,41.278737],[69.123049,41.270019],[69.12427,41.267265],[69.145639,41.280113],[69.147471,41.276901],[69.147471,41.264971],[69.168839,41.239725],[69.162734,41.234216],[69.166397,41.230543],[69.170877,41.228229],[69.170877,41.223469],[69.17528,41.220365],[69.182433,41.216846],[69.184634,41.211672],[69.18601,41.205255],[69.184634,41.199252],[69.204444,41.177718],[69.221503,41.171712],[69.231408,41.166949],[69.24599,41.166327],[69.278735,41.166229]]]},"properties":{"name":"Tashkent"}},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[30.231998,59.929687]},"properties":{"name":"St Petersburg","old_name":"Leningrad","description":"Many pieces eventually translated to Uzbek were written in St Petersburg because they were both in the USSR. From here, Lermontov's \"Masquerade\" (translated by Oybek); Pushkin's \"Bori Godunov\" (Cho'lpon), \"Eugene Onegin\" (Oybek), \"The Bronze Horseman\" (Maqsud Shayxzoda), \"The Fountain of Bakhchisarai\" (Usman Nasir), and various others (G'afur G'ulom) were produced here.","DeepDive":"horizontal","date":"various times"}},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[27.13107,38.422455]},"properties":{"name":"İzmir","old_name":"Ionia","description":"Parts of the Iliad were translated by Oybek, and it's generally accepted that the Iliad was composed mostly in Ionia, modern-day İzmir.","DeepDive":"horizontal"},"bbox":[26.857784,38.264417,27.303915,38.581672]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[34.169556,44.499954]},"properties":{"name":"Yalta","description":"Once part of the USSR, Nikolai Nekrasov wrote his \"Who is Happy in Russia?\" (translated by Mirtemir into Uzbek) here.","DeepDive":"horizontal"},"bbox":[33.9118,44.3779,34.2952,44.6441]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[22.944689,40.633987]},"properties":{"name":"Thessaloniki","old_name":"Selanik","description":"In the Ottoman Empire, Nâzım Hikmet wrote various works that were translated to Uzbek by Mirtemir.","DeepDive":"horizontal"},"bbox":[22.888543,40.586082,22.991042,40.653152]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[8.683012,50.110596]},"properties":{"name":"Frankfurt","old_name":"","description":"Germany was home to Johann von Goethe, whose \"Faust\" was translated to Uzbek by Oybek.","DeepDive":"horizontal"},"bbox":[8.472761,50.015353,8.800405,50.227136]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[2.348392,48.853495]},"properties":{"name":"Paris ","old_name":"","description":"Connected to many cities intellectually, Paris was politically influential to Tashkent. Works from here include Beaumarchais's \"Le Mariage de Figaro\" (translated by G'afur G'ulom) and Heinrich Heine's poetry (Mirtemir).","DeepDive":"horizontal"},"bbox":[2.224229,48.815562,2.469851,48.902148]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[-0.127647,51.5073]},"properties":{"name":"London","old_name":"","description":"Many Uzbek translators had a focus on Shakespeare. Hamlet (translated by Cho'lpon, Maqsud Shayxzoda), Othello (G'afur G'ulom), and Romeo and Juliet (Maqsud Shayxzoda) were prominent. In addition, Maqsud Shayxzoda translated Lord Byron's \"Childe Harold's Pilgrimage,\" written in London.","DeepDive":"horizontal"},"bbox":[-0.351652,51.384527,0.153177,51.669993]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[41.624686,41.644682]},"properties":{"name":"Rustaveli","description":"An important work repeatedly translated to Uzbek (notably by Mirtemir, Maqsud Shayxzoda) was \"A Knight in the Panther's Skin\" by Shota Rustaveli.","DeepDive":"horizontal","date":1967}},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[41.972973,45.044834]},"properties":{"name":"Stavropol","old_name":"Voroshilovsk ","description":"The location of Lermontov's exile, he wrote \"The Demon\" here, translated to Uzbek by Usman Nasir.","DeepDive":"horizontal"},"bbox":[41.694364,44.968608,42.090402,45.112944]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[52.537064,29.605162]},"properties":{"name":"Shiraz","description":"Where the first written copy of the Gulistan is from, compiled by Saadi Shirazi and translated to Uzbek by G'afur G'ulom.","old_name":"Tiraziš ","DeepDive":"horizontal"},"bbox":[51.804979,29.189363,53.073541,29.947252]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[28.449385,45.424355]},"properties":{"name":"Nagirne","old_name":"Mahuldür","description":"Şamil Alâdin had various connections to translators in Tashkent, but was primarily helped by Oybek to have Uzbek versions of his Turkish works published.","DeepDive":"horizontal"},"bbox":[28.3946,45.3646,28.5294,45.5149]},
  {"type":"Feature","geometry":{"type":"Point","coordinates":[69.249966,41.322498]},"properties":{"name":"State Publishing House of Uzbekistan","description":"Modern-day location of the State Publishing House of Uzbekistan, where several translations of works were published and where various translators worked","DeepDive":"vertical"}}]};

  const map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function nameOf(props) { return (props && (props.Name || props.name || props.label)) || ""; }

  let mainLatLng = null;
  const layer = L.geoJSON(data, {
    pointToLayer: function (feature, latlng) {
      const isMain = nameOf(feature.properties) === MAIN_PLACE;
      if (isMain) mainLatLng = latlng;
      return L.circleMarker(latlng, {
        radius: isMain ? 11 : 7,
        fillColor: isMain ? "#c0392b" : "#2c5f8a",
        color: "#ffffff", weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function (feature, lyr) {
      const p = feature.properties || {};
      const name = p.Name || p.name || p.label || "Untitled";
      const date = p.Date || p.date || "";
      const desc = p.Description || p.description || "";
      lyr.bindPopup(
        '<div class="popup-name">' + name + "</div>" +
        (date ? '<div class="popup-date">' + date + "</div>" : "") +
        '<div class="popup-desc">' + desc + "</div>"
      );
      lyr.on("click", function () { if (lyr.getLatLng) map.flyTo(lyr.getLatLng(), CLICK_ZOOM); });
    }
  }).addTo(map);

  if (mainLatLng) { map.setView(mainLatLng, START_ZOOM); }
  else if (layer.getBounds().isValid()) { map.fitBounds(layer.getBounds(), { padding: [40, 40] }); }
  </script>
</body>
</html>
